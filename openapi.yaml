openapi: 3.0.3
info:
  title: Utopia API
  version: 0.1.0
  description: Firefly-III-compatible household finance API.
servers:
  - url: http://localhost:{port}
    variables:
      port:
        default: "8080"
security:
  - bearerAuth: []
paths:
  /api/v1/accounts:
    get:
      tags:
        - Accounts
      summary: List accounts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: type
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Account list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FireflyListEnvelopeAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Accounts
      summary: Create account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FireflySingleEnvelopeAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags:
        - Accounts
      summary: Get account
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FireflySingleEnvelopeAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
        - Accounts
      summary: Update account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FireflySingleEnvelopeAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Accounts
      summary: Delete account
      responses:
        '204':
          description: Account deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/tokens:
    post:
      tags:
        - Tokens
      summary: Issue a personal access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenIssuanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/TokenId'
    delete:
      tags:
        - Tokens
      summary: Revoke a personal access token
      responses:
        '204':
          description: Token revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/v1/bootstrap/tokens:
    post:
      tags:
        - Bootstrap
      summary: Issue a bootstrap token
      security:
        - bootstrapKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Bootstrap token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenIssuanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /metrics:
    get:
      tags:
        - Metrics
      summary: Prometheus metrics endpoint
      security: []
      responses:
        '200':
          description: Metrics payload
          content:
            text/plain:
              schema:
                type: string

components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TokenId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    bootstrapKey:
      type: apiKey
      in: header
      name: X-Bootstrap-Key
  responses:
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FireflyErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FireflyErrorResponse'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FireflyErrorResponse'
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FireflyErrorResponse'
  schemas:
    FireflyErrorResponse:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    PaginationMeta:
      type: object
      required:
        - total
        - count
        - per_page
        - current_page
        - total_pages
      properties:
        total:
          type: integer
          format: int64
        count:
          type: integer
          format: int64
        per_page:
          type: integer
        current_page:
          type: integer
        total_pages:
          type: integer
    FireflyListMeta:
      type: object
      required:
        - pagination
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    FireflyListEnvelopeAccount:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FireflyAccountResource'
        meta:
          $ref: '#/components/schemas/FireflyListMeta'
    FireflySingleEnvelopeAccount:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/FireflyAccountResource'
    FireflyLink:
      type: object
      required:
        - rel
        - uri
      properties:
        rel:
          type: string
        uri:
          type: string
    FireflyAccountResource:
      type: object
      required:
        - type
        - id
        - attributes
        - links
      properties:
        type:
          type: string
          example: accounts
        id:
          type: string
          format: uuid
        attributes:
          $ref: '#/components/schemas/FireflyAccountAttributes'
        links:
          type: array
          items:
            $ref: '#/components/schemas/FireflyLink'
    FireflyAccountAttributes:
      type: object
      required:
        - created_at
        - updated_at
        - name
        - type
        - currency_code
        - current_balance
        - active
        - currency_decimal_places
        - primary_currency_code
        - primary_currency_name
        - primary_currency_symbol
        - primary_currency_decimal_places
        - current_balance_date
        - include_net_worth
      properties:
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        name:
          type: string
        type:
          type: string
        currency_code:
          type: string
        current_balance:
          type: string
        active:
          type: boolean
        order:
          type: integer
          nullable: true
        currency_name:
          type: string
          nullable: true
        currency_symbol:
          type: string
          nullable: true
        currency_decimal_places:
          type: integer
        primary_currency_code:
          type: string
        primary_currency_name:
          type: string
        primary_currency_symbol:
          type: string
        primary_currency_decimal_places:
          type: integer
        initial_balance:
          type: string
          nullable: true
        virtual_balance:
          type: string
          nullable: true
        current_balance_date:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
        iban:
br:
          type: string
          nullable: true
        bic:
          type: string
          nullable: true
        account_number:
          type: string
          nullable: true
        opening_balance:
          type: string
          nullable: true
        opening_balance_date:
: string
          format: date-time
          nullable: true
        include_net_worth:
          type: boolean
        account_role:
          type: string
          nullable: true
        liability_type:
: string
          type: string
          nullable: true
        liability_direction:
: string
          type: string
          nullable: true
        interest:
          type: string
          nullable: true
        interest_period:
: string
          type: string
          nullable: true
        credit_card_type:
          type: string
          nullable: true
        monthly_payment_date:
: string
          type: string
          nullable: true
    CreateAccountRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
        currency_code:
          type: string
          nullable: true
        active:
          type: boolean
          nullable: true
        include_net_worth:
          type: boolean
          nullable: true
        account_role:
          type: string
          nullable: true
        iban:
          type: string
          nullable: true
        bic:
          type: string
          nullable: true
        account_number:
          type: string
          nullable: true
        opening_balance:
          type: string
          nullable: true
        opening_balance_date:
: string
          format: date-time
          nullable: true
        virtual_balance:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        liability_type:
: string
          type: string
          nullable: true
        liability_direction:
: string
          type: string
          nullable: true
        interest:
          type: string
          nullable: true
        interest_period:
: string
          type: string
          nullable: true
    UpdateAccountRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        currency_code:
          type: string
          nullable: true
        active:
          type: boolean
          nullable: true
        include_net_worth:
          type: boolean
          nullable: true
        account_role:
          type: string
          nullable: true
        iban:
          type: string
          nullable: true
        bic:
          type: string
          nullable: true
        account_number:
          type: string
          nullable: true
        opening_balance:
          type: string
          nullable: true
        opening_balance_date:
: string
          format: date-time
          nullable: true
        virtual_balance:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        liability_type:
: string
          type: string
          nullable: true
        liability_direction:
: string
          type: string
          nullable: true
        interest:
          type: string
          nullable: true
        interest_period:
: string
          type: string
          nullable: true
    TokenRequest:
      type: object
      required:
        - label
      properties:
        label:
          type: string
    TokenIssuanceResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/TokenIssuancePayload'
    TokenIssuancePayload:
      type: object
      required:
        - id
        - label
        - token
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        token:
          type: string
        status:
          type: string
        created_at:
: string
          format: date-time
